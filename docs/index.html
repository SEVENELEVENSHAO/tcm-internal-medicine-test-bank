<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f2"><title>中医内科学 · 题库练习</title>
<style>
.selection-hint{margin:-8px 0 8px}.choice-letter{display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:4px}.multi-choice .choice-letter{border-radius:5px}.choice.selected .choice-letter{background:var(--green);color:#fff;border-color:var(--green)}.grade{margin-top:14px;padding:10px 12px;border-radius:var(--r);font-weight:650}.grade-correct{background:var(--soft);color:var(--green)}.grade-incorrect{background:var(--redbg);color:#863a34}.question:has(.answer.review) .choice.incorrect,.question:has(.answer.none) .choice.incorrect{border-color:var(--green);background:var(--soft)}
:root{color-scheme:light;--paper:#f5f6f2;--surface:#fff;--ink:#202822;--muted:#68746d;--line:#dce2dc;--green:#28614d;--soft:#e7f1eb;--amber:#8a5b18;--amberbg:#fbf0dc;--redbg:#f8e9e7;--blue:#365d79;--bluebg:#eaf1f6;--r:6px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #78a892;outline-offset:2px}.shell{max-width:1340px;margin:auto;padding:28px 36px 64px}.topline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-weight:700;font-size:17px}.brand small{font-weight:400;color:var(--muted);margin-left:10px}.database-count,.result-count,.position{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}.intro{padding:30px 0 22px}.eyebrow{font-size:13px;font-weight:650;color:var(--green);margin:0 0 6px}.intro h1{font-size:30px;line-height:1.25;margin:0;font-weight:680}.intro p{color:var(--muted);margin:8px 0 0;max-width:740px}.workspace{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;align-items:start}.filters{border-right:1px solid var(--line);padding-right:24px;position:sticky;top:20px}.filters h2{font-size:16px;margin:0 0 18px}.field{display:grid;gap:6px;margin-bottom:15px}.field label{font-size:13px;font-weight:630}.field select,.field input{width:100%;height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink)}.checkline{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--muted);margin:5px 0 16px}.checkline input{margin-top:5px;accent-color:var(--green)}.filter-note{font-size:13px;color:var(--muted);padding-top:13px;border-top:1px solid var(--line)}.main{min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.toolbar-actions{display:flex;gap:8px}.button{border:1px solid var(--line);background:#fff;color:var(--ink);min-height:42px;padding:8px 14px;border-radius:var(--r);font-weight:620}.button:hover{background:#edf1ec}.button.primary{background:var(--green);color:white;border-color:var(--green)}.button:disabled{opacity:.45;cursor:not-allowed}.question{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 30px 24px;min-height:350px}.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.tag{font-size:12px;border-radius:3px;padding:3px 7px;background:var(--soft);color:#194b39;font-weight:650}.tag.type{background:#edf0ed;color:#59635d}.tag.status{background:var(--bluebg);color:var(--blue)}.tag.review{background:var(--amberbg);color:var(--amber)}.tag.none{background:#edf0ed;color:#59635d}.qtext{font-size:19px;line-height:1.75;white-space:pre-wrap;margin:0 0 22px}.choices{display:grid;gap:8px}.choice{display:grid;grid-template-columns:24px 1fr;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;text-align:left;line-height:1.6;color:var(--ink)}.choice:hover{border-color:#9db5a7;background:#f8faf8}.choice.selected,.choice.correct{border-color:var(--green);background:var(--soft)}.choice.incorrect{border-color:#d59a95;background:var(--redbg)}.choice-letter{font-weight:700;color:var(--green)}.answer{margin-top:18px;padding:14px 16px;border-left:3px solid var(--green);background:#f2f7f3}.answer.review{border-color:var(--amber);background:#fcf6ea}.answer.none{border-color:#89928b;background:#f1f3f1}.answer-title{font-weight:700}.sub{font-size:14px;color:var(--muted)}.source{font-size:13px;color:var(--muted);margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}.question-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}.statusbar{min-height:24px;margin-top:9px;color:var(--muted);font-size:13px}.empty,.error{padding:44px 26px;text-align:center;border:1px dashed #bcc7bf;background:#fbfcfa;color:var(--muted)}.loading{opacity:.65}@media(max-width:800px){.shell{padding:18px}.workspace{grid-template-columns:1fr;gap:20px}.filters{position:static;border-right:0;border-bottom:1px solid var(--line);padding:0 0 12px}.filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.question{padding:21px 19px}}@media(max-width:480px){.shell{padding:12px}.brand{font-size:15px}.brand small{display:block;margin:0}.database-count{text-align:right;font-size:12px}.intro{padding:21px 0 17px}.intro h1{font-size:25px}.filter-grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.toolbar-actions{width:100%}.toolbar-actions .button{flex:1}.question-nav{flex-wrap:wrap}.question-nav .position{width:100%;order:-1}.qtext{font-size:17px}.question{min-height:280px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="shell">
<header class="topline"><div class="brand">中医内科学 <small>题库练习</small></div><div class="database-count" id="databaseCount">正在读取题库…</div></header>
<section class="intro"><p class="eyebrow">学习模式</p><h1>按系统练习，逐题核对</h1><p>先作答，再查看答案。答案依据题库原文及练习册答案页；OCR 或匹配不确定的内容会单独标记。</p></section>
<div class="workspace"><aside class="filters"><h2>筛选题目</h2><div class="filter-grid">
<div class="field"><label for="source">题库来源</label><select id="source"><option value="3">练习册（按系统分类）</option><option value="all">全部题库</option></select></div><div class="field"><label for="system">脏腑 / 系统</label><select id="system"><option value="">全部系统</option></select></div><div class="field"><label for="topic">病证专题</label><select id="topic"><option value="">全部专题</option></select></div><div class="field"><label for="answerStatus">答案状态</label><select id="answerStatus"><option value="">全部状态</option><option value="source_answer_present">有答案依据</option><option value="needs_review">待核对</option><option value="not_in_source">原题库无答案</option></select></div><div class="field"><label for="search">搜索题干 / 专题</label><input id="search" type="search" placeholder="输入关键词" autocomplete="off"></div><label class="checkline"><input id="unansweredOnly" type="checkbox"><span>优先练习尚未作答的题目</span></label></div><div class="filter-note" id="answerCounts"></div></aside>
<main class="main"><div class="toolbar"><div class="result-count" id="resultCount">载入题目…</div><div class="toolbar-actions"><button class="button" id="shuffle">随机一题</button><button class="button" id="nextTop">下一题 →</button></div></div><div id="questionRegion" aria-live="polite"><div class="empty">正在读取题目…</div></div><div class="question-nav"><button class="button" id="previous">← 上一题</button><div class="position" id="position"></div><button class="button" id="next">下一题 →</button></div><div class="statusbar" id="statusbar" role="status"></div></main></div></div>
<script>
let staticData=null,staticMode=false;const state={questions:[],index:0,total:0,meta:null,selected:null,revealed:null,answered:new Set(JSON.parse(localStorage.getItem('tcm-answered')||'[]'))};const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const statusNames={source_answer_present:'有答案依据',needs_review:'待核对',not_in_source:'原题库无答案'};
function optionsFor(text){const marker=/(?:^|\s)([A-E])\s*[.．、:：，,。]\s*/g,matches=[...text.matchAll(marker)],out=[];for(let i=0;i<matches.length;i++){const start=matches[i].index+matches[i][0].length,end=i+1<matches.length?matches[i+1].index:text.length;const value=text.slice(start,end).trim();if(value)out.push({letter:matches[i][1],text:value})}return out.length>=2?out:[]}function current(){return state.questions[state.index]}
function answerLetters(text){const match=String(text||'').trim().match(/^([A-E]{1,5})(?:\s*[.．、:：]|$)/i);return match?new Set(match[1].toUpperCase()):new Set()}
function render(){const q=current();if(!q){$('questionRegion').innerHTML='<div class="empty">当前筛选下没有题目。请更改系统、专题或答案状态。</div>'; $('position').textContent='';$('resultCount').textContent='0 道题';$('previous').disabled=$('next').disabled=true;return}const opts=optionsFor(q.question_text),multi=q.question_type==='Multiple',selected=new Set(state.selected||''),answered=state.answered.has(q.id),tagclass=q.answer_status==='needs_review'?'review':q.answer_status==='not_in_source'?'none':'';let body='';if(opts.length){const key=state.revealed&&state.revealed.answer_status==='source_answer_present'?answerLetters(state.revealed.answer_text):new Set();const isCorrect=key.size>0&&key.size===selected.size&&[...key].every(letter=>selected.has(letter));body=(multi?'<div class="sub selection-hint">多项选择 · 已选 '+selected.size+' 项</div>':'')+'<div class="choices">'+opts.map(o=>{const isSelected=selected.has(o.letter),known=key.size>0;let stateClass=isSelected?'selected ':'';if(known&&isSelected)stateClass+=key.has(o.letter)?'correct ':'incorrect ';if(known&&!isSelected&&key.has(o.letter))stateClass+='correct ';return '<button type="button" class="choice '+stateClass+(multi?'multi-choice ':'')+'" aria-pressed="'+isSelected+'" data-choice="'+o.letter+'" '+(state.revealed?'disabled':'')+'><span class="choice-letter">'+o.letter+'</span><span>'+esc(o.text)+'</span></button>'}).join('')+'</div>';if(state.revealed&&key.size)body+='<div class="grade '+(isCorrect?'grade-correct':'grade-incorrect')+'">'+(isCorrect?'回答正确':'回答不正确')+' · 你的选择 '+[...selected].sort().join('')+' · 正确答案 '+[...key].sort().join('')+'</div>'}else body='<div class="sub">本题为问答题或选项未能可靠识别。请先自行作答，再查看答案。</div>';let answer='';if(state.revealed){const r=state.revealed;const cls=r.answer_status==='needs_review'?'review':r.answer_status==='not_in_source'?'none':'';const title=r.answer_text?'参考答案：'+esc(r.answer_text):(r.answer_status==='needs_review'?'答案匹配待核对':'原题库未提供答案');const note=r.answer_status==='source_answer_present'?'答案来自练习册印刷答案页；请留意 OCR 识别可能造成的文字误差。':r.answer_status==='needs_review'?'已发现疑似答案线索，但匹配不确定，请以原书核实。':'此题没有可确认的答案记录。';answer='<div class="answer '+cls+'"><div class="answer-title">'+title+'</div><div class="sub">'+note+'</div>'+(r.evidence_text?'<div class="sub">依据：'+esc(r.evidence_text)+' · 答案页 '+esc(r.answer_page||'未知')+'</div>':'')+'</div>'}const control=state.revealed?'<button class="button" id="toggleAnswer">收起答案</button>':'<button class="button primary" id="toggleAnswer">'+(opts.length?'提交并查看答案':'查看参考答案')+'</button>';$('questionRegion').innerHTML='<article class="question"><div class="qmeta"><span class="tag">'+esc(q.topic||'未分类')+'</span><span class="tag type">'+esc(q.question_type||'题目')+'</span><span class="tag status '+tagclass+'">'+(statusNames[q.answer_status]||'状态未知')+'</span></div><p class="qtext">'+esc(q.question_text)+'</p>'+body+answer+'<div class="source">来源：'+esc(q.source_name)+' · 第 '+esc(q.source_page)+' 页</div></article><div style="margin-top:14px">'+control+'</div>';$('questionRegion').querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{const letter=b.dataset.choice;if(multi){const chosen=new Set(state.selected||'');chosen.has(letter)?chosen.delete(letter):chosen.add(letter);state.selected=[...chosen].sort().join('')}else state.selected=letter;render()}));$('toggleAnswer').addEventListener('click',toggleAnswer);$('position').textContent='第 '+(state.index+1)+' / '+state.questions.length+' 题'+(answered?' · 已作答':'');$('resultCount').textContent=state.total.toLocaleString()+' 道题符合筛选';$('previous').disabled=state.index===0;$('next').disabled=state.index>=state.questions.length-1}
async function toggleAnswer(){if(state.revealed){state.revealed=null;render();return}const q=current(),selection=state.selected||'';if(optionsFor(q.question_text).length&&!selection){$('statusbar').textContent='请先选择答案，或直接跳过。';return}try{if(staticMode)state.revealed=staticData.questions.find(item=>item.id===q.id);else{const r=await fetch('/api/questions/'+q.id+'/answer');if(!r.ok)throw Error();state.revealed=await r.json()}state.answered.add(q.id);localStorage.setItem('tcm-answered',JSON.stringify([...state.answered]));const key=state.revealed.answer_status==='source_answer_present'?answerLetters(state.revealed.answer_text):new Set();const chosen=new Set(selection);$('statusbar').textContent=key.size?(key.size===chosen.size&&[...key].every(letter=>chosen.has(letter))?'回答正确':'回答不正确')+'。你的选择：'+[...chosen].sort().join('')+'；参考答案：'+[...key].sort().join(''):'';render()}catch{$('statusbar').textContent='答案读取失败，请检查本地服务。'}}
async function loadQuestions(){const source=$('source').value,system=$('system').value,topic=$('topic').value,status=$('answerStatus').value,search=$('search').value.trim().toLocaleLowerCase();$('questionRegion').classList.add('loading');try{if(staticMode){const topics=state.meta.systems[system];state.questions=staticData.questions.filter(q=>(!source||source==='all'||String(q.source_id)===source)&&(!topics||topics.includes(q.topic))&&(!topic||q.topic===topic)&&(!status||q.answer_status===status)&&(!search||(q.question_text||'').toLocaleLowerCase().includes(search)||(q.topic||'').toLocaleLowerCase().includes(search)));state.total=state.questions.length;if($('unansweredOnly').checked)state.questions=state.questions.filter(q=>!state.answered.has(q.id));state.total=state.questions.length;state.questions=state.questions.slice(0,500)}else{const p=new URLSearchParams();[['source',source],['system',system],['topic',topic],['status',status]].forEach(([k,v])=>{if(v)p.set(k,v)});if(search)p.set('q',$('search').value.trim());p.set('limit','500');const r=await fetch('/api/questions?'+p);if(!r.ok)throw Error();const d=await r.json();state.questions=d.questions;state.total=d.total;if($('unansweredOnly').checked)state.questions=state.questions.filter(q=>!state.answered.has(q.id))}state.index=0;state.selected=null;state.revealed=null;$('questionRegion').classList.remove('loading');render();$('statusbar').textContent=state.total>500?'仅载入前 500 道题，请缩小筛选范围。':''}catch{$('questionRegion').classList.remove('loading');$('questionRegion').innerHTML='<div class="error">无法载入题库数据，请刷新页面或检查网络连接。</div>'}}
function move(n){if(!state.questions.length)return;state.index=Math.max(0,Math.min(state.questions.length-1,state.index+n));state.selected=null;state.revealed=null;render()}function shuffle(){if(!state.questions.length)return;state.index=Math.floor(Math.random()*state.questions.length);state.selected=null;state.revealed=null;render()}
async function init(){try{try{const r=await fetch('/api/meta');if(!r.ok)throw Error();state.meta=await r.json()}catch{const r=await fetch('./data/questions.json');if(!r.ok)throw Error();staticData=await r.json();state.meta=staticData.meta;staticMode=true}Object.keys(state.meta.systems).forEach(n=>$('system').insertAdjacentHTML('beforeend','<option value="'+esc(n)+'">'+esc(n)+'</option>'));state.meta.topics.forEach(t=>$('topic').insertAdjacentHTML('beforeend','<option value="'+esc(t.topic)+'">'+esc(t.topic)+' ('+t.question_count+')</option>'));const total=Object.values(state.meta.counts).reduce((a,b)=>a+b,0);$('databaseCount').textContent=total.toLocaleString()+' 道题 · '+state.meta.topics.length+' 个专题';$('answerCounts').textContent='有答案依据 '+(state.meta.counts.source_answer_present||0)+' · 待核对 '+(state.meta.counts.needs_review||0)+' · 尚无答案 '+(state.meta.counts.not_in_source||0);const book=state.meta.sources.find(x=>x.filename.includes('练习册'));if(book)$('source').value=String(book.id);$('source').insertAdjacentHTML('beforeend',state.meta.sources.filter(x=>!x.filename.includes('练习册')).map(x=>'<option value="'+x.id+'">'+esc(x.filename)+' ('+x.question_count+')</option>').join(''));let timer;$('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(loadQuestions,220)});['source','system','topic','answerStatus','unansweredOnly'].forEach(id=>$(id).addEventListener('change',()=>{if(id==='system')$('topic').value='';loadQuestions()}));$('previous').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('nextTop').addEventListener('click',()=>move(1));$('shuffle').addEventListener('click',shuffle);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});await loadQuestions()}catch{$('databaseCount').textContent='题库读取失败';$('questionRegion').innerHTML='<div class="error">题库读取失败，请稍后重试。</div>'}}
init();
</script></body></html>
