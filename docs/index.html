<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6f2"><title>中医题库 · 中医内科与金匮要略</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./quiz.css"><script src="./quiz.js" defer></script>
</head>
<body><div class="shell">
<header class="topline"><div class="brand">中医题库 <small>逐题练习与核对</small></div><div class="database-count" id="databaseCount">正在读取题库…</div></header>
<section class="intro"><p class="eyebrow" id="subjectName">学习模式</p><h1>按科目练习，逐题核对</h1><p>先作答，再查看原文参考答案。选择题支持判分；填空、简答与病案供自行核对，待核对题目不判分。</p></section>
<div class="workspace">
<aside class="filters"><h2>筛选题目</h2><div class="filter-grid">
<div class="field"><label for="subject">学习科目</label><select id="subject"><option value="all">全部科目</option></select></div>
<div class="field"><label for="source">题库来源</label><select id="source"><option value="all">全部来源</option></select></div>
<div class="field" id="chapterField"><label for="chapter">原书篇章</label><select id="chapter"><option value="">全部篇章</option></select></div>
<div class="field" id="systemField" hidden><label for="system">脏腑 / 系统</label><select id="system"><option value="">全部系统</option></select></div>
<div class="field" id="topicField" hidden><label for="topic">病证专题</label><select id="topic"><option value="">全部专题</option></select></div>
<div class="field"><label for="questionType">题型</label><select id="questionType"><option value="">全部题型</option></select></div>
<div class="field"><label for="answerStatus">答案状态</label><select id="answerStatus"><option value="">全部状态</option><option value="source_answer_present">有答案依据</option><option value="needs_review">待核对</option><option value="not_in_source">尚无可确认答案</option></select></div>
<div class="field"><label for="search">搜索题干 / 选项 / 专题</label><input id="search" type="search" placeholder="输入关键词" autocomplete="off"></div>
<label class="checkline"><input id="unansweredOnly" type="checkbox"><span>只练习尚未作答的题目</span></label>
</div><div class="filter-note" id="answerCounts"></div><a class="report-link" href="./import-report.md" target="_blank" rel="noopener">查看金匮资料导入报告</a></aside>
<main class="main">
<div class="toolbar"><div class="result-count" id="resultCount">载入题目…</div><div class="toolbar-actions"><button class="button" id="shuffle">随机一题</button><button class="button" id="nextTop">下一题 →</button></div></div>
<div id="questionRegion" aria-live="polite"><div class="empty">正在读取题目…</div></div>
<div class="question-nav"><button class="button" id="previous">← 上一题</button><div class="position" id="position"></div><button class="button" id="next">下一题 →</button></div>
<div class="statusbar" id="statusbar" role="status"></div>
</main></div></div></body></html>
